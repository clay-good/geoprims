[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/clay-good/geoprims"
rust-version = "1.98"

[workspace.dependencies]
gp-base = { path = "crates/gp-base" }
libm = "0.2"
ryu = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# H3 fills walk hundreds of thousands of cells. Size-optimized Wasm made a
# 250,000-cell fill take 12.5 s; speed-optimizing these two crates brings it
# to about 3 s for 13 KB (compressed) more. Rust never reorders or fuses
# floating-point operations, so results stay bit-identical.
[profile.release.package.h3o]
opt-level = 3

[profile.release.package.gp-indexing]
opt-level = 3
