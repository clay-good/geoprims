name: npm publish dry run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  package:
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install pinned wasm-opt
        run: |
          v=$(node -p "require('./tools/toolchain.json').wasmOpt")
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${v}/binaryen-version_${v}-x86_64-linux.tar.gz" | tar xz
          echo "$PWD/binaryen-version_${v}/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the publishable MCP package
        run: |
          npm run build
          npm run build:mcp
      - name: Audit npm advisories and licenses
        run: |
          npm audit --prefix apps/web --audit-level=high
          node tools/repo/npm-licenses.mjs
      - name: Verify package contents and provenance
        working-directory: mcp
        run: npm publish --dry-run --provenance --access public
