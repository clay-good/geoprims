schema: spec-driven

context: |
  Product: geoprims.com — geospatial and aerospace primitives.
  A static, client-side catalog of geodesy, navigation, aviation, drone,
  surveying, spatial-indexing, and raster math tools, plus a local MCP
  server that runs the exact same compute core. Two surfaces only:
  the static website (humans) and the local MCP server (agents).

  Ethos (non-negotiable):
    - Zero ads, zero accounts, zero tracking, zero server-side compute.
    - User inputs never leave the device. Only static assets are fetched.
      Sole exception: a problem report the user reviews and sends (a small
      Cloudflare Worker + D1 on /api/reports*; it computes nothing).
    - Glanceable: answer first, in a plain sentence, with example values
      prefilled; every result shows its work, sources, and last-verified date.
    - Prove value before breadth: hero tools first (plan-launch-and-value-proof).
    - Instant: the shell loads fast, tools compute in milliseconds.
    - Every result is reproducible, cited, and states its accuracy.
    - Humans get a tactical "retro-HUD" web app; agents get the local MCP server.

  Stack direction (decided in establish-platform-foundation/design.md):
    - Compute core: Rust compiled to WebAssembly (wasm32-unknown-unknown),
      one crate per domain, lazy-loaded per domain in the browser.
    - Same Wasm artifacts power the web app and the local MCP server
      (Node.js runtime). No separate CLI or public library package.
    - Tool manifest is the single source of truth: it generates the web
      forms, MCP schemas, docs pages, and search index.
    - Web: statically pre-rendered pages (answer in the HTML), progressive
      enhancement, installable PWA, WebGL2 canvas (WebGPU opportunistic),
      hosted on Cloudflare Workers static assets.
    - MCP: zero-dependency server.mjs; release tags run from a git clone
      with Node alone.
    - Pattern source for reporting, citations, freshness, SEO shells, and
      mobile gates: roughlogic.com (docs/research/06-roughlogic-patterns.md).

  Domain vocabulary:
    - "Operation": one distinct mathematical function with its own
      contract and test vectors (e.g. geodesic inverse).
    - "Endpoint": one addressable route/tool id. Conversion pairs are
      endpoints generated from operations (e.g. dms-to-utm).
    - Angles in degrees at the boundary, radians internally.
    - Canonical internal units are SI; the boundary accepts tagged units.
    - Coordinate order: explicit field names (lat, lon) in tool inputs;
      GeoJSON I/O follows RFC 7946 [lon, lat] order.
    - "WGS84" alone is ambiguous; tools name the realization or state the
      accuracy consequence of treating realizations as equal.

  Conventions:
    - Conventional Commits; American English; ISO 8601 dates in data.
    - Tool ids: `<domain>.<group>.<operation>` in lowercase kebab segments.

rules:
  proposal:
    - Include a Non-goals list.
    - Lead with the user value, then the mechanism.
  specs:
    - Every numeric requirement names its unit and tolerance.
    - Every tool family names its reference source and at least one
      authoritative test vector source.
    - Cover edge cases explicitly (poles, antimeridian, antipodes,
      degenerate geometry, out-of-domain inputs).
  design:
    - Record alternatives considered for each decision.
    - Include a tool inventory table with endpoint counts per family.
  tasks:
    - Each task states how it is verified.

operations:
  apply:
    guidance:
      - Implement the platform foundation change before any domain change.
      - A tool is not done until its golden vectors pass in browser and Node.
