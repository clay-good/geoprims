[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/clay-good/geoprims"
rust-version = "1.98"

[workspace.dependencies]
gp-base = { path = "crates/gp-base" }
libm = "0.2"
ryu = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
