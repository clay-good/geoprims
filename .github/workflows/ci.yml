name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install pinned wasm-opt
        run: |
          v=$(node -p "require('./tools/toolchain.json').wasmOpt")
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${v}/binaryen-version_${v}-x86_64-linux.tar.gz" | tar xz
          echo "$PWD/binaryen-version_${v}/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format
        run: cargo fmt --manifest-path core/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path core/Cargo.toml
      - name: Build Wasm modules (prints and enforces pinned versions, import lint, size budgets)
        run: node tools/wasm/build.mjs
      - name: JS tests (module smoke tests, lint and budget fixtures)
        run: node --test 'tools/**/*.test.mjs'
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: dist/wasm
