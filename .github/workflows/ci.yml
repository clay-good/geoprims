name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install pinned wasm-opt
        run: |
          v=$(node -p "require('./tools/toolchain.json').wasmOpt")
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${v}/binaryen-version_${v}-x86_64-linux.tar.gz" | tar xz
          echo "$PWD/binaryen-version_${v}/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin the build date to this commit
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Format
        # A virtual workspace has no targets of its own: --all is what reaches the crates.
        run: cargo fmt --all --manifest-path core/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path core/Cargo.toml
      - name: Build Wasm modules (prints and enforces pinned versions, import lint, size budgets)
        run: node tools/wasm/build.mjs
      - name: Catalog (dist/catalog/v1.json with honest counts)
        run: node tools/codegen/catalog.mjs
      - name: Build the MCP release directory (so the integrity gate checks it too)
        run: node tools/mcp/build-dist.mjs
      - name: JS tests (gates, runtime, vectors through Wasm, vector integrity, MCP server and Worker end to end)
        run: npm run test:js
        env:
          VECTOR_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
      - name: Website build and checks
        run: |
          npm ci --prefix apps/web
          npm run build --prefix apps/web
          npm test --prefix apps/web
      - name: Install browsers for cross-host checks
        run: npm exec --prefix apps/web -- playwright install --with-deps chromium firefox webkit
      - name: Browser checks
        run: npm run test:browser --prefix apps/web
      - name: Chromium reference benchmark
        run: npm run bench:browser --prefix apps/web -- --output ../../chromium-benchmark.json > chromium-benchmark.md
      - uses: actions/upload-artifact@v4
        with:
          name: chromium-benchmark
          path: |
            chromium-benchmark.json
            chromium-benchmark.md
      - name: Hash shipped artifacts
        run: node tools/wasm/artifact-digests.mjs > artifact-digests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: build-digests-primary
          path: artifact-digests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: dist

  independent-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install pinned wasm-opt
        run: |
          v=$(node -p "require('./tools/toolchain.json').wasmOpt")
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${v}/binaryen-version_${v}-x86_64-linux.tar.gz" | tar xz
          echo "$PWD/binaryen-version_${v}/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin the build date to this commit
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build all shipped artifacts on a separate runner
        run: |
          npm run build
          node tools/mcp/build-dist.mjs
          npm ci --prefix apps/web
          npm run build --prefix apps/web
      - name: Hash shipped artifacts
        run: node tools/wasm/artifact-digests.mjs > artifact-digests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: build-digests-independent
          path: artifact-digests.txt

  compare-builds:
    needs: [core, independent-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-digests-primary
          path: primary
      - uses: actions/download-artifact@v4
        with:
          name: build-digests-independent
          path: independent
      - name: Compare every shipped byte
        run: diff -u primary/artifact-digests.txt independent/artifact-digests.txt
